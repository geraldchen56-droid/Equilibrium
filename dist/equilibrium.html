<!doctype html>
<html lang="en" data-depth="intuition">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equilibrium: game theory, solved live</title>
<link rel="preload" as="image" href="img/hero-sm.webp" imagesrcset="img/hero-sm.webp 1280w, img/hero.webp 2560w" imagesizes="100vw">
<meta name="description" content="An interactive game theory course where every game is solved live by a real engine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Fraunces:opsz,wght,SOFT@9..144,200..400,0..100&family=Geist:wght@300..500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<style>/* ================= Course pages =================
   Same language as the landing page: black ground, warm ivory ink, Fraunces 200 for display,
   Geist for text, hairline rules instead of boxes, and quiet motion. Dark in every colour scheme. */

:root {
  --paper: #000;
  --panel: #0c0c0c;
  --panel-2: #141414;
  --ink: #ede8df;
  --soft: #b9b2a6;
  --muted: #8f897f;
  --rule: rgba(237, 232, 223, .18);
  --rule-strong: rgba(237, 232, 223, .38);
  --grid: #1a1a1a;
  --row: #8aa6ff;  --row-soft: #8aa6ff1f;   /* Row player: cobalt */
  --col: #f0b429;  --col-ink: #f0b429; --col-soft: #f0b4291f; /* Column player: marigold */
  --eq: #45c993;   --eq-soft: #45c9931a;    /* Equilibrium */
  --bad: #ff8f80;
  --display: "Fraunces", "Source Serif 4", Georgia, serif;
  --text: "Geist", "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ui: var(--text);
  --read: var(--text);
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 300 18px/1.7 var(--text); letter-spacing: -0.003em; -webkit-font-smoothing: antialiased; }
::selection { background: var(--ink); color: #000; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-strong); text-decoration-thickness: 1px; text-underline-offset: 4px; transition: text-decoration-color .2s; }
a:hover { text-decoration-color: var(--ink); }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
strong, b { font-weight: 500; }
em { font-style: italic; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 8px; z-index: 40; background: var(--ink); color: #000; padding: 6px 10px; }

/* ---------- Top bar (mirrors the landing nav) ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  height: 64px; padding: 0 clamp(16px, 3vw, 36px); background: rgba(0, 0, 0, .82);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule);
}
.brand { grid-column: 2; justify-self: center; font: 300 22px/1 var(--display); letter-spacing: -0.02em; color: var(--ink); text-decoration: none; font-variation-settings: "opsz" 144, "SOFT" 30; }
.toc-toggle { grid-column: 1; grid-row: 1; justify-self: start; display: none; font: 400 14px/1 var(--text); color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--rule-strong); padding: 8px 0; cursor: pointer; }
.depth-switch { grid-column: 3; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: 18px; font: 400 14px var(--text); }
.depth-label { color: var(--muted); }
.depth-switch button { font: inherit; color: var(--muted); background: none; border: 0; border-bottom: 1px solid transparent; padding: 6px 0; cursor: pointer; transition: color .2s, border-color .2s; }
.depth-switch button:hover { color: var(--ink); }
.depth-switch button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
.toc { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 64px); overflow: auto; padding: 40px 28px 48px clamp(16px, 3vw, 36px); font: 300 15px/1.4 var(--text); border-right: 1px solid var(--rule); scrollbar-width: thin; }
.toc a, .toc .soon { display: block; padding: 5px 0; color: var(--soft); text-decoration: none; transition: color .2s; }
.toc a:hover, .toc a.active { color: var(--ink); }
.toc a.active { position: relative; }
.toc a.active::before { content: ""; position: absolute; left: -14px; top: 50%; width: 6px; height: 1px; background: var(--ink); }
.toc .soon { color: var(--muted); opacity: .6; }
.toc-home { font-weight: 400; color: var(--ink) !important; }
.toc-part { margin: 28px 0 6px; font: 400 12px/1.3 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc-list { margin: 0; padding-left: 0; list-style: none; counter-reset: ch var(--start, 0); }
.toc-list li { display: grid; grid-template-columns: 1.8em 1fr; }
.toc-list li::before { content: attr(data-n); color: var(--muted); font-size: 13px; padding-top: 6px; font-variant-numeric: tabular-nums; }
main { padding: 0 clamp(20px, 5vw, 72px) 120px; min-width: 0; }
main:focus { outline: none; }
.chapter { max-width: 720px; }

/* ---------- Chapter header: the part's photograph ---------- */
.ch-head { position: relative; isolation: isolate; margin: 0 calc(-1 * clamp(20px, 5vw, 72px)) 56px; padding: clamp(120px, 22vh, 220px) clamp(20px, 5vw, 72px) 44px; overflow: hidden; border-bottom: 1px solid var(--rule); }
.ch-head img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0; transform: scale(1.05); transition: opacity 1.2s ease, transform 2.2s var(--ease); }
.ch-head.is-in img { opacity: 1; transform: none; }
.ch-head::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, #000 0%, rgba(0,0,0,.82) 42%, rgba(0,0,0,.35) 100%); }
.ch-head > :not(img) { max-width: 760px; }
.chapter-num { font: 400 13px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin: 0 0 18px; }
.ch-head h1 { opacity: 0; filter: blur(10px); transform: translateY(6px); transition: opacity 1s ease, filter 1.1s ease, transform 1.1s var(--ease); }
.ch-head.is-in h1 { opacity: 1; filter: none; transform: none; }
.ch-blurb { color: var(--soft); font-size: clamp(17px, 1.5vw, 20px); margin: 20px 0 0; max-width: 40ch; }

/* ---------- Type ---------- */
h1, h2, h3 { font-family: var(--display); font-weight: 200; letter-spacing: -0.03em; line-height: 1.04; color: var(--ink); font-variation-settings: "opsz" 144, "SOFT" 30; }
h1 { font-size: clamp(44px, 6.4vw, 92px); margin: 0; }
h2 { font-size: clamp(32px, 3.6vw, 46px); margin: 96px 0 20px; padding-top: 28px; border-top: 1px solid var(--rule); }
h3 { font-size: 26px; margin: 40px 0 12px; }
p { margin: 0 0 18px; }
.lede { font: 200 clamp(22px, 2.2vw, 28px)/1.42 var(--display); letter-spacing: -0.015em; color: var(--ink); font-variation-settings: "opsz" 72, "SOFT" 30; }
.math { font-family: var(--display); font-style: italic; font-weight: 300; white-space: nowrap; letter-spacing: 0; }
sub, sup { font-size: .72em; }

/* ---------- Payoff matrix (Schelling notation) ---------- */
.matrix-wrap { margin: 28px 0; overflow-x: auto; }
.matrix { border-collapse: collapse; font-family: var(--text); }
.matrix th { font-weight: 400; font-size: 15px; padding: 6px 12px; }
.matrix thead th { text-align: center; vertical-align: bottom; }
.matrix tbody th { text-align: right; }
.matrix .corner { position: relative; width: 112px; height: 52px; padding: 0;
  background: linear-gradient(to top right, transparent calc(50% - .5px), var(--rule) 50%, transparent calc(50% + .5px)); }
.who { position: absolute; font-size: 12px; font-weight: 400; letter-spacing: .04em; }
.who-p1 { top: 4px; right: 8px; color: var(--col-ink); }
.who-p0 { bottom: 4px; left: 8px; color: var(--row); }
.cell { width: 104px; height: 76px; padding: 0; border: 1px solid var(--rule); background: var(--panel); position: relative; transition: background-color .25s, box-shadow .25s, opacity .3s; }
.cell .split { position: absolute; inset: 0; background: linear-gradient(to top right, transparent calc(50% - .5px), var(--rule) 50%, transparent calc(50% + .5px)); }
.pay { position: absolute; font-size: 21px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1; padding: 2px 3px; }
.pay-p0 { left: 10px; bottom: 10px; color: var(--row); }
.pay-p1 { right: 10px; top: 10px; color: var(--col-ink); }
.pay.best { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
input.pay { width: auto; min-width: 2.2ch; border: 1px dashed var(--rule); border-radius: 2px; background: transparent; font-family: var(--text); text-align: center; }
input.pay:hover, input.pay:focus { border-color: var(--rule-strong); }
.cell.clickable { cursor: pointer; }
.cell.clickable:hover { background: var(--panel-2); }
.cell.hi { background: var(--row-soft); }
.cell.nash { box-shadow: inset 0 0 0 2px var(--eq); background: var(--eq-soft); }
.cell.dead { opacity: .18; }
.strat { font: inherit; color: inherit; }
.strat-p0 { color: var(--row); }
.strat-p1 { color: var(--col-ink); }
button.strat { background: none; border: 1px solid transparent; border-radius: 2px; padding: 4px 8px; cursor: pointer; }
button.strat:hover { border-color: currentColor; }
.strat.dead { text-decoration: line-through; opacity: .45; }
.matrix-wrap figcaption, figcaption { font: 300 14px/1.5 var(--text); color: var(--muted); margin-top: 12px; max-width: 60ch; }
.key { font: 300 14px var(--text); color: var(--muted); margin: 0; }
.chip { font-weight: 400; }
.chip-p0 { color: var(--row); }
.chip-p1 { color: var(--col-ink); }
.arrow { position: absolute; font: 400 16px/1 var(--text); }
.arrow-p1 { left: 9px; top: 8px; color: var(--col-ink); }
.arrow-p0 { right: 9px; bottom: 8px; color: var(--row); }
.cell.marked { box-shadow: inset 0 0 0 2px var(--ink); }
.cell.marked.nash { box-shadow: inset 0 0 0 2px var(--eq); }
.matrix td.cell { min-width: 104px; }
.matrix th.corner { min-width: 112px; }

/* ---------- Interactives: a framed instrument, not a card ---------- */
.interactive { position: relative; margin: 36px 0 44px; padding: 28px 28px 24px; background: var(--panel); border: 1px solid var(--rule); }
.interactive::before { content: ""; position: absolute; left: -1px; top: -1px; width: 28px; height: 1px; background: var(--ink); }
.interactive .matrix-wrap { margin: 14px 0; }
.prompt { font: 400 17px/1.5 var(--text); color: var(--ink); }
.result { font-size: 19px; font-weight: 400; }
.choices, .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
.btn {
  font: 400 14px/1 var(--text); letter-spacing: .01em; padding: 13px 20px; border: 1px solid var(--rule-strong); border-radius: 0;
  background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block;
  transition: background-color .25s, border-color .25s, color .25s;
}
.btn:hover { border-color: var(--ink); }
.btn-p0 { background: var(--ink); border-color: var(--ink); color: #000; }
.btn-p0:hover { background: #fff; border-color: #fff; }
.btn-quiet { border-color: var(--rule); color: var(--soft); }
.btn-quiet:hover { color: var(--ink); border-color: var(--rule-strong); }
.btn-small { padding: 6px 10px; font-size: 13px; margin-left: 6px; }
.compare { font-size: 16px; padding-left: 20px; }
.compare li { margin-bottom: 4px; }
.feedback { font: 300 16px/1.6 var(--text); padding: 2px 0 2px 16px; border-left: 1px solid var(--rule-strong); margin: 14px 0; }
.feedback.good, .feedback.done { border-color: var(--eq); }
.feedback.bad { border-color: var(--bad); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-bottom: 10px; border-bottom: 1px solid var(--rule); }
.tabs button { font: 400 14px var(--text); padding: 10px 0; margin-bottom: -1px; border: 0; border-bottom: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; transition: color .2s, border-color .2s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.legend { font: 300 14px/1.55 var(--text); color: var(--muted); }
.display { text-align: center; margin: 16px 0 20px; font-size: 21px; }
.steps { font: 300 16px/1.6 var(--text); padding-left: 22px; }
.steps li { margin-bottom: 4px; }
.muted { color: var(--muted); }

/* ---------- Depth layers ---------- */
.depth { margin: 32px 0; padding: 22px 0 6px 24px; border-left: 1px solid var(--row); font-size: 17px; }
.depth-quant { border-left-color: var(--col); }
.depth-tag { display: block; font: 400 12px var(--text); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.depth-formal .depth-tag { color: var(--row); }
.depth-quant .depth-tag { color: var(--col); }
[data-depth="intuition"] .depth-formal, [data-depth="intuition"] .depth-quant, [data-depth="formal"] .depth-quant { display: none; }
.drill .matrix-wrap { margin: 8px 0; }

.tip { margin: 72px 0 0; padding: 22px 0 0; border-top: 1px solid var(--rule-strong); font: 300 17px/1.6 var(--text); color: var(--soft); }
.tip strong { display: block; font: 400 12px var(--text); letter-spacing: .1em; text-transform: uppercase; color: var(--col); margin-bottom: 8px; }
.pager { margin-top: 96px; padding-top: 28px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pager a { text-decoration: none; display: grid; gap: 4px; }
.pager .lbl { font: 400 12px var(--text); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pager .ttl { font: 200 clamp(24px, 3vw, 34px)/1.1 var(--display); letter-spacing: -0.02em; border-bottom: 1px solid var(--rule); padding-bottom: 4px; transition: border-color .2s; }
.pager a:hover .ttl { border-color: var(--ink); }
.pager .next { text-align: right; margin-left: auto; }
.soon-note { font: 300 15px var(--text); color: var(--muted); }

/* ---------- Reveal on scroll ---------- */
.reveal { opacity: 0; transform: translateY(14px); transition: opacity .9s ease, transform 1s var(--ease); }
.reveal.is-in { opacity: 1; transform: none; }

/* ---------- Plots, stats, worked steps ---------- */
.scoreboard { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; font: 300 15px/1.4 var(--text); margin-bottom: 10px; color: var(--soft); }
.scoreboard strong { font: 300 22px var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.scoreboard strong.big { font-size: 40px; }
.pips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px; min-height: 24px; }
.pip { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 500 11px var(--text); color: #000; }
.pip.goal { background: var(--eq); }
.pip.miss { background: var(--bad); }
.plot { width: 100%; max-width: 600px; height: auto; display: block; margin: 12px 0; font-family: var(--text); }
.plot .grid { stroke: var(--grid); stroke-width: 1; }
.plot .tick { fill: var(--muted); font-size: 11px; }
.plot .axis { fill: var(--muted); font-size: 12px; }
.plot .lineLabel { font-size: 13px; font-weight: 500; }
.plot .cursor { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; }
.plot .eqdot { fill: var(--eq); stroke: var(--panel); stroke-width: 2; }
.range { display: grid; gap: 6px; font: 400 15px var(--text); margin: 8px 0 14px; max-width: 600px; }
.range input[type="range"] { width: 100%; accent-color: var(--ink); }
.worked { padding-left: 22px; font: 300 16px/1.6 var(--text); }
.worked li { margin-bottom: 14px; }
.worked li::marker { color: var(--muted); }
.worked p { margin: 2px 0 0; color: var(--soft); }
.stats { border-collapse: collapse; font: 300 15px var(--text); margin: 8px 0; font-variant-numeric: tabular-nums; }
.stats th, .stats td { padding: 8px 14px 8px 0; border-bottom: 1px solid var(--rule); text-align: left; }
.stats th { color: var(--muted); font-weight: 400; }
td.chip-p0, td.chip-p1 { font-weight: 400; }

/* ---------- Trees ---------- */
.tree-wrap { margin: 18px 0; }
.tree-scroll { overflow-x: auto; }
.tree { width: 100%; height: auto; display: block; margin: 0 auto; font-family: var(--text); }
.tree .edge { stroke: var(--rule-strong); stroke-width: 1.5; transition: stroke .3s, opacity .3s; }
.tree .edge.chosen { stroke: var(--eq); stroke-width: 3; }
.tree .edge.cut { opacity: .25; }
.tree .edge.on { stroke: var(--eq); stroke-width: 3.5; }
.tree .action { fill: var(--soft); font-size: 14px; font-weight: 400; }
.tree .action.cut { opacity: .3; }
.tree .node { stroke: #000; stroke-width: 3; }
.tree .node-p0 { fill: var(--row); }
.tree .node-p1 { fill: var(--col); }
.tree .node.current { stroke: var(--eq); stroke-width: 3; }
.tree .node-label { fill: #000; font-size: 13px; font-weight: 500; pointer-events: none; }
.tree .leaf { font-size: 16px; font-weight: 400; fill: var(--muted); }
.tree .leaf.on { fill: var(--eq); }
.tree .carried { font-size: 13px; font-weight: 400; fill: var(--muted); }
.tree .v-p0 { fill: var(--row); }
.tree .v-p1 { fill: var(--col-ink); }
.race-log { display: flex; flex-wrap: wrap; gap: 6px; font: 300 14px var(--text); }
.said { padding: 4px 10px; border: 1px solid var(--rule); }
.said.you { color: var(--row); border-color: var(--row-soft); background: var(--row-soft); }
.said.cpu { color: var(--col-ink); border-color: var(--col-soft); background: var(--col-soft); }
.table-scroll { overflow-x: auto; }
.pirates td, .pirates th { text-align: center; padding: 8px 10px; }
.pirates td:first-child { text-align: left; white-space: nowrap; }

/* ---------- Generic bar / population charts (Ch 6+) ---------- */
.bars { display: grid; gap: 8px; margin: 14px 0; }
.bar { display: grid; grid-template-columns: minmax(90px, 9em) 1fr 4.5em; align-items: center; gap: 12px; font: 300 14px var(--text); }
.bar .track { height: 10px; background: var(--grid); position: relative; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--ink); transition: width .5s var(--ease); }
.bar .fill.p0 { background: var(--row); }
.bar .fill.p1 { background: var(--col); }
.bar .fill.eq { background: var(--eq); }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--soft); }
.bar.win .num { color: var(--ink); }
.grid-cells { display: grid; gap: 2px; margin: 12px 0; max-width: 420px; }
.grid-cells span { aspect-ratio: 1; transition: background-color .4s; }
.pill { display: inline-block; padding: 2px 8px; border: 1px solid var(--rule-strong); font: 400 13px var(--text); margin: 2px 4px 2px 0; }
.pill.p0 { color: var(--row); border-color: var(--row); }
.pill.p1 { color: var(--col-ink); border-color: var(--col); }
.pill.eq { color: var(--eq); border-color: var(--eq); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.field { display: grid; gap: 6px; font: 400 14px var(--text); }
.field input[type="number"], .field select { font: 300 16px var(--text); color: var(--ink); background: var(--paper); border: 1px solid var(--rule-strong); padding: 8px 10px; border-radius: 0; }

/* ---------- Small screens ---------- */
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { position: fixed; top: 64px; left: 0; bottom: 0; width: min(320px, 86vw); max-height: none; background: #000; border-right: 1px solid var(--rule); transform: translateX(-100%); transition: transform .35s var(--ease); z-index: 15; padding-left: 28px; }
  body.toc-open .toc { transform: none; }
  .toc-toggle { display: inline-block; }
  .depth-label { display: none; }
}
@media (max-width: 860px) {
  body { font-size: 17px; }
  main { padding: 0 16px 96px; }
  .ch-head { margin: 0 -16px 40px; padding: 120px 16px 32px; }
  h2 { margin-top: 72px; }
  .cell { width: 84px; height: 66px; }
  .pay { font-size: 18px; }
  .matrix .corner { width: 90px; }
  .matrix td.cell { min-width: 76px; }
  .matrix th.corner { min-width: 96px; }
  .interactive { padding: 20px 16px 16px; margin-left: -4px; margin-right: -4px; }
  .two-col { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .topbar { grid-template-columns: auto 1fr auto; gap: 10px; padding: 0 14px; height: 58px; }
  .brand { font-size: 19px; }
  .depth-switch { gap: 10px; font-size: 13px; }
  .toc { top: 58px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .reveal, .ch-head h1, .ch-head img { opacity: 1; transform: none; filter: none; }
}
.btn.on, .btn[aria-pressed="true"].btn-quiet { border-color: var(--ink); color: var(--ink); background: var(--panel-2); }
.display .math { white-space: normal; }
.band { position: relative; height: 14px; background: var(--grid); margin: 18px 0 8px; max-width: 600px; }
.band-ok { position: absolute; top: 0; bottom: 0; background: var(--eq); opacity: .55; transition: left .3s, width .3s; }
.band-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--ink); transition: left .2s; }

/* ================= Landing page (#/) =================
   Photographic, full-bleed and dark in both colour schemes: the photos set the mood,
   and the course pages (styles.css) now share the same dark language. */

body.landing { background: #000; }
body.landing .topbar, body.landing .toc { display: none; }
body.landing .layout { display: block; max-width: none; }
body.landing main { padding: 0; }

.lp {
  --lp-bg: #000;
  --lp-ink: #ede8df;
  --lp-soft: #b9b2a6;
  --lp-line: rgba(237, 232, 223, .26);
  --lp-display: "Fraunces", "Source Serif 4", Georgia, serif;
  --lp-text: "Geist", "Archivo", system-ui, sans-serif;
  /* Game colours re-tuned for a black page */
  --paper: #000; --panel: #0f0f0f; --ink: #ede8df; --muted: #a39d93; --rule: #3a3833; --grid: #191919;
  --row: #8aa6ff; --row-soft: #8aa6ff24; --col: #f0b429; --col-ink: #f0b429; --col-soft: #f0b42924;
  --eq: #45c993; --eq-soft: #45c9931f;
  background: var(--lp-bg); color: var(--lp-ink);
  font: 300 18px/1.6 var(--lp-text); letter-spacing: -0.005em;
  color-scheme: dark;
}
.lp a { color: inherit; }
.lp :focus-visible { outline: 2px solid var(--lp-ink); outline-offset: 3px; border-radius: 2px; }
.lp h1, .lp h2, .lp h3 {
  font-family: var(--lp-display); font-weight: 200; font-stretch: normal; color: var(--lp-ink);
  font-variation-settings: "opsz" 144, "SOFT" 30; letter-spacing: -0.035em; line-height: 1.02; margin: 0;
}

/* ---------- Fixed nav ---------- */
.lp-nav {
  position: fixed; inset: 0 0 auto; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 18px clamp(16px, 3vw, 36px); pointer-events: none;
}
.lp-nav > * { pointer-events: auto; }
.lp-brand { justify-self: center; font: 300 22px/1 var(--lp-display); letter-spacing: -0.02em; text-decoration: none; color: var(--lp-ink); }
.lp-nav-btn {
  justify-self: start; font: 400 14px/1 var(--lp-text); color: var(--lp-ink); background: none; border: 0; padding: 10px 0; cursor: pointer;
  text-decoration: none; border-bottom: 1px solid var(--lp-line);
}
.lp-nav-btn:hover { border-bottom-color: var(--lp-ink); }
.lp-nav-start { justify-self: end; }
.lp-nav::before { /* soft shade so the nav stays legible over bright photos */
  content: ""; position: absolute; inset: 0 0 -40px; z-index: -1; pointer-events: none;
  background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
}

/* ---------- Overlay menu ---------- */
.lp-menu {
  position: fixed; inset: 0; z-index: 25; background: #000; overflow: auto;
  display: grid; place-items: center; padding: 96px 20px 40px;
}
.lp-menu[hidden] { display: none; }
body.lp-menu-open { overflow: hidden; }
.lp-menu-list { list-style: none; margin: 0; padding: 0; width: min(760px, 100%); }
.lp-menu-list li { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--lp-line); }
.lp-menu-list .n { font: 300 15px var(--lp-text); color: var(--lp-soft); font-variant-numeric: tabular-nums; }
.lp-menu-list a, .lp-menu-list li > span:nth-child(2) {
  font: 200 clamp(24px, 3.6vw, 38px)/1.15 var(--lp-display); letter-spacing: -0.03em; text-decoration: none;
}
.lp-menu-list a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.lp-menu-list .is-soon > span:nth-child(2) { color: var(--lp-soft); opacity: .6; }
.soon { font: 300 13px var(--lp-text); color: var(--lp-soft); white-space: nowrap; }

/* ---------- Full-bleed photo panels ---------- */
.lp-panel { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; isolation: isolate; background: #000; }
.lp-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.lp-panel::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.lp-hold { height: 100vh; height: 100svh; }

/* Buttons */
.lp-btn {
  display: inline-block; font: 400 14px/1 var(--lp-text); letter-spacing: .01em; color: var(--lp-ink); text-decoration: none;
  padding: 15px 22px; border: 1px solid var(--lp-line); background: rgba(0,0,0,.25); backdrop-filter: blur(6px);
  transition: background-color .25s, border-color .25s, color .25s;
}
.lp-btn:hover { border-color: var(--lp-ink); background: rgba(0,0,0,.5); }
.lp .lp-btn-solid { background: var(--lp-ink); color: #000; border-color: var(--lp-ink); }
.lp .lp-btn-solid:hover { background: #fff; color: #000; }

/* ---------- 1. Hero ---------- */
.lp-hero .lp-photo { object-position: 50% 70%; }
.lp-hero::after { background: radial-gradient(120% 70% at 50% 100%, transparent 40%, rgba(0,0,0,.35)); }
.lp-hero-text { position: absolute; inset: 12vh 20px 9vh; text-align: center; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.lp-hero h1 { font-size: clamp(46px, min(8.6vw, 14vh), 150px); }
.lp-hero p { margin-left: clamp(0px, 4vw, 76px) !important; }
.lp-hero h1 span { display: inline-block; }
.lp-hero p { margin: 0; align-self: flex-start; text-align: left; max-width: 30ch; color: var(--lp-soft); font-size: clamp(16px, 1.4vw, 19px); }
/* The page's one orchestrated moment: the headline focuses out of blur on load. */
.lp-hero h1 span, .lp-hero p { opacity: 0; filter: blur(14px); transform: translateY(8px); transition: opacity 1.1s ease, filter 1.3s ease, transform 1.3s cubic-bezier(.2,.7,.2,1); }
.lp-hero.is-in h1 span, .lp-hero.is-in p { opacity: 1; filter: blur(0); transform: none; }
.lp-hero.is-in h1 span:nth-child(2) { transition-delay: .25s; }
.lp-hero.is-in p { transition-delay: .7s; }
.lp-hero .lp-photo { transform: scale(1.06); transition: transform 2.4s cubic-bezier(.2,.7,.2,1); }
.lp-hero.is-in .lp-photo { transform: none; }

/* ---------- 2. Statement ---------- */
.lp-statement .lp-photo { object-position: 70% 50%; }
.lp-statement::after { background: linear-gradient(90deg, rgba(0,0,0,.94) 0%, rgba(0,0,0,.8) 46%, rgba(0,0,0,.1) 72%); }
.lp-statement-inner { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 clamp(20px, 6vw, 96px); }
.lp-statement-text {
  max-width: min(19em, 42vw) !important;
  font: 200 clamp(28px, 3.6vw, 54px)/1.14 var(--lp-display); letter-spacing: -0.03em; max-width: 19em; margin: 0;
  font-variation-settings: "opsz" 144, "SOFT" 30;
}
.lp-statement-text .w { color: rgba(237, 232, 223, .16); transition: color .35s ease; }
.lp-statement-text .w.on { color: var(--lp-ink); }

/* ---------- 3. Play first ---------- */
.lp-play {
  position: relative; z-index: 1; background: #000; display: grid; gap: clamp(32px, 5vw, 80px);
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: center;
  padding: clamp(96px, 14vh, 160px) clamp(20px, 6vw, 96px); border-top: 1px solid var(--lp-line);
}
.lp-play h2, .lp-depths-head h2 { font-size: clamp(38px, 5vw, 76px); margin-bottom: 22px; }
.lp-play-copy p { color: var(--lp-soft); max-width: 40ch; margin-bottom: 30px; }
.lp-play-game { font-family: var(--lp-text); }
.lp-play-game .key { font-size: 14px; color: var(--lp-soft); }
.lp-play-game .matrix-wrap { margin: 10px 0 14px; }
.lp-play-game .matrix { font-family: var(--lp-text); }
.lp-play-game .pay { font-weight: 500; }
.lp-play-game .cell { background: #0f0f0f; }
.lp-status { min-height: 3.2em; margin: 0; font-size: 16px; color: var(--lp-ink); border-left: 1px solid var(--lp-line); padding: 2px 0 2px 14px; }

/* ---------- 4. Three depths ---------- */
.lp-depths { position: relative; z-index: 1; background: #000; padding: clamp(96px, 14vh, 160px) clamp(20px, 6vw, 96px); border-top: 1px solid var(--lp-line); }
.lp-depths-head { max-width: 760px; margin-bottom: clamp(48px, 8vh, 96px); }
.lp-depths-head p { color: var(--lp-soft); max-width: 46ch; margin: 0; }
.lp-depth-list { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(64px, 10vh, 120px); }
.lp-depth { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(24px, 4vw, 64px); align-items: end; }
.lp-depth:nth-child(even) { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); }
.lp-depth:nth-child(even) .lp-depth-img { order: 2; }
.lp-depth-img { position: relative; aspect-ratio: 16 / 10; overflow: hidden; }
.lp-depth-img .lp-photo { z-index: 0; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.lp-depth:hover .lp-depth-img .lp-photo { transform: scale(1.03); }
.lp-count { font-size: 15px; color: var(--lp-soft); margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.lp-count span { color: var(--lp-ink); }
.lp-depth h3 { font-size: clamp(44px, 5.4vw, 84px); margin-bottom: 18px; }
.lp-depth-text p:not(.lp-count) { color: var(--lp-soft); margin-bottom: 28px; max-width: 38ch; }

/* ---------- 5. Course parts ---------- */
.lp-course { position: relative; z-index: 1; background: #000; }
.lp-course-h { font-size: clamp(38px, 5vw, 76px); padding: clamp(96px, 14vh, 160px) clamp(20px, 6vw, 96px) clamp(40px, 6vh, 72px); border-top: 1px solid var(--lp-line); }
.lp-part::after { background: linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 38%, rgba(0,0,0,.1) 70%); }
.lp-part:nth-of-type(3) .lp-photo { object-position: 50% 35%; } /* cards: keep the hands in frame */
.lp-part-text { position: absolute; inset: auto 0 0; padding: 0 clamp(20px, 6vw, 96px) clamp(32px, 7vh, 72px);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: clamp(24px, 5vw, 80px); align-items: end; }
.lp-part-num { grid-column: 1; font-size: 15px; color: var(--lp-soft); margin: 0 0 4px; }
.lp-part h3 { grid-column: 1; font-size: clamp(48px, 7vw, 116px); }
.lp-part-line { grid-column: 2; grid-row: 1 / span 2; align-self: end; color: var(--lp-ink); max-width: 40ch; margin: 0; }
.lp-part-list { grid-column: 1 / -1; list-style: none; margin: clamp(24px, 4vh, 40px) 0 0; padding: 0; display: flex; flex-wrap: wrap; border-top: 1px solid var(--lp-line); }
.lp-part-list li { flex: 1 1 220px; padding: 14px 20px 0 0; display: flex; flex-direction: column; gap: 2px; counter-increment: none; }
.lp-part-list li::before { content: "Chapter " attr(data-n); font-size: 13px; color: var(--lp-soft); }
.lp-part-list a { font-size: 17px; text-decoration: none; border-bottom: 1px solid var(--lp-line); align-self: start; padding-bottom: 2px; }
.lp-part-list a:hover { border-bottom-color: var(--lp-ink); }
.lp-part-list .is-soon > span:not(.soon) { color: var(--lp-soft); font-size: 17px; }

/* ---------- 6. Close + footer ---------- */
.lp-close { position: relative; z-index: 1; }
.lp-close::after { background: radial-gradient(90% 70% at 50% 45%, rgba(0,0,0,.65), rgba(0,0,0,.2)); }
.lp-close-text { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 36px; text-align: center; padding: 20px; }
.lp-close h2 { font-size: clamp(52px, 10vw, 168px); }
.lp-footer { position: relative; z-index: 1; background: #000; padding: 40px clamp(20px, 6vw, 96px) 56px; border-top: 1px solid var(--lp-line); font-size: 14px; }
.lp-footer nav { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-bottom: 22px; }
.lp-footer nav a, .lp-footer nav button { font: inherit; color: var(--lp-ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; border-bottom: 1px solid var(--lp-line); }
.lp-footer nav a:hover, .lp-footer nav button:hover { border-bottom-color: var(--lp-ink); }
.lp-credits { color: var(--lp-soft); max-width: 90ch; margin: 0; font-size: 13px; }
.lp-credits a { color: var(--lp-soft); }

/* Scroll progress line */
.lp-progress { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; z-index: 30; background: rgba(237,232,223,.12); }
.lp-progress span { display: block; height: 100%; background: var(--lp-ink); transform-origin: 0 50%; transform: scaleX(0); }

/* ---------- Small screens ---------- */
@media (max-width: 860px) {
  .lp { font-size: 17px; }
  .lp-hero-text { inset: 13vh 16px auto; justify-content: flex-start; }
  .lp-hero p { align-self: center; text-align: center; margin-top: 18px; margin-left: 0 !important; }
  .lp-statement .lp-photo { object-position: 78% 50%; }
  .lp-statement::after { background: linear-gradient(0deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.1) 75%); }
  .lp-statement-inner { align-items: flex-end; padding-bottom: 12vh; }
  .lp-statement-text { max-width: none !important; }
  .lp-part::after { background: linear-gradient(0deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.82) 55%, rgba(0,0,0,.2) 85%); }
  .lp-play, .lp-depth, .lp-depth:nth-child(even) { grid-template-columns: minmax(0, 1fr); }
  .lp-depth:nth-child(even) .lp-depth-img { order: 0; }
  .lp-part-text { grid-template-columns: minmax(0, 1fr); }
  .lp-part-line { grid-column: 1; grid-row: auto; margin-top: 14px; }
  .lp-part-list li { flex-basis: 100%; padding-top: 10px; }
  .lp-play-game .matrix-wrap { overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .lp-hero h1 span, .lp-hero p, .lp-hero .lp-photo { opacity: 1; filter: none; transform: none; }
  .lp-statement-text .w { color: var(--lp-ink); }
}
</style>
