<!doctype html>
<html lang="en" data-depth="intuition">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equilibrium: game theory, solved live</title>
<link rel="preload" as="image" href="img/hero-sm.webp" imagesrcset="img/hero-sm.webp 1280w, img/hero.webp 2560w" imagesizes="100vw">
<meta name="description" content="An interactive game theory course where every game is solved live by a real engine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Fraunces:opsz,wght,SOFT@9..144,200..400,0..100&family=Geist:wght@300..500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<style>:root {
  --paper: #f2f4f6;
  --panel: #ffffff;
  --ink: #18202b;
  --muted: #5b6573;
  --rule: #c9d1db;
  --grid: #e1e6ec;
  --row: #2a4fd6;         /* Row player: cobalt */
  --row-soft: #2a4fd61a;
  --col: #c98a00;         /* Column player: marigold (fills) */
  --col-ink: #845a00;     /* Column player: marigold (text) */
  --col-soft: #c98a001f;
  --eq: #0e7f57;          /* Equilibrium */
  --eq-soft: #0e7f5714;
  --bad: #b3261e;
  --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141b; --panel: #161d27; --ink: #e6eaf0; --muted: #9aa4b2; --rule: #334050; --grid: #1b2430;
    --row: #7d9bff; --row-soft: #7d9bff22; --col: #f0b429; --col-ink: #f0b429; --col-soft: #f0b42922;
    --eq: #3cc08a; --eq-soft: #3cc08a1c; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141b; --panel: #161d27; --ink: #e6eaf0; --muted: #9aa4b2; --rule: #334050; --grid: #1b2430;
  --row: #7d9bff; --row-soft: #7d9bff22; --col: #f0b429; --col-ink: #f0b429; --col-soft: #f0b42922;
  --eq: #3cc08a; --eq-soft: #3cc08a1c; --bad: #ff8a80; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.65 var(--read); }
a { color: var(--row); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--row); outline-offset: 2px; border-radius: 3px; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 8px; z-index: 10; background: var(--panel); padding: 6px 10px; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 20px; background: var(--paper); border-bottom: 1px solid var(--rule); font-family: var(--ui);
}
.brand { font-weight: 800; font-stretch: 80%; font-size: 21px; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.toc-toggle { display: none; }
.depth-switch { margin-left: auto; display: flex; align-items: center; gap: 2px; font-size: 14px; }
.depth-label { color: var(--muted); margin-right: 8px; }
.depth-switch button {
  font: inherit; font-weight: 600; padding: 6px 12px; border: 1px solid var(--rule); background: transparent; color: var(--muted); cursor: pointer;
}
.depth-switch button:first-of-type { border-radius: 6px 0 0 6px; }
.depth-switch button:last-of-type { border-radius: 0 6px 6px 0; }
.depth-switch button + button { border-left: 0; }
.depth-switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
.toc { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow: auto; padding: 28px 20px 40px; font: 15px/1.45 var(--ui); }
.toc a, .toc .soon { display: block; padding: 4px 0; color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--row); }
.toc a.active { color: var(--row); font-weight: 650; }
.toc .soon { color: var(--muted); opacity: .7; }
.toc-home { font-weight: 600; }
.toc-part { margin: 22px 0 4px; font-weight: 700; font-stretch: 85%; color: var(--muted); font-size: 13.5px; }
.toc-list { margin: 0; padding-left: 22px; }
.toc-list li::marker { color: var(--muted); font-size: 13px; }
main { padding: 40px 32px 96px; min-width: 0; }
main:focus { outline: none; }
.chapter, .intro, .chapter-list, .hero { max-width: 700px; }

/* ---------- Type ---------- */
h1, h2, h3 { font-family: var(--ui); line-height: 1.1; letter-spacing: -0.015em; }
h1 { font-size: 46px; font-weight: 800; font-stretch: 78%; margin: 0 0 24px; }
h2 { font-size: 27px; font-weight: 750; font-stretch: 85%; margin: 56px 0 12px; }
p { margin: 0 0 16px; }
.lede { font-size: 21px; line-height: 1.55; }
.chapter-num { font: 600 15px var(--ui); color: var(--muted); margin: 0 0 6px; }
.math { font-style: italic; white-space: nowrap; }
sub { font-size: .72em; }

/* ---------- Hero ---------- */
.hero { padding: 8px 0 8px; }
.hero h1 { font-size: clamp(56px, 11vw, 112px); font-stretch: 62%; font-weight: 800; line-height: .92; letter-spacing: -0.03em; margin: 0 0 16px; }
.hero-sub { font-size: 21px; max-width: 34ch; margin-bottom: 28px; }
.hero-game {
  padding: 24px; border: 1px solid var(--rule); border-radius: 10px;
  background-color: var(--panel);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.hero-game .matrix-wrap { margin: 8px 0 12px; }
.hero-status { font: 500 16px/1.5 var(--ui); margin: 0; min-height: 3em; background: var(--panel); padding: 8px 10px; border-radius: 6px; }
.intro { margin-top: 40px; }
.start { margin-top: 8px; }
.chapter-list ol { padding-left: 28px; }
.chapter-list li { margin-bottom: 12px; }
.chapter-list li::marker { font: 600 15px var(--ui); color: var(--muted); }
.chapter-list a, .chapter-list li > span:first-child { font: 650 18px var(--ui); display: block; }
.chapter-list .blurb { font-size: 16px; color: var(--muted); }
.chapter-list .is-soon > span:first-child { color: var(--muted); }

/* ---------- Payoff matrix (Schelling notation) ---------- */
.matrix-wrap { margin: 24px 0; overflow-x: auto; }
.matrix { border-collapse: collapse; font-family: var(--ui); }
.matrix th { font-weight: 600; font-size: 15px; padding: 6px 10px; }
.matrix thead th { text-align: center; vertical-align: bottom; }
.matrix tbody th { text-align: right; }
.matrix .corner { position: relative; width: 112px; height: 52px; padding: 0;
  background: linear-gradient(to top right, transparent calc(50% - .5px), var(--rule) 50%, transparent calc(50% + .5px)); }
.who { position: absolute; font-size: 13px; font-weight: 700; }
.who-p1 { top: 4px; right: 8px; color: var(--col-ink); }
.who-p0 { bottom: 4px; left: 8px; color: var(--row); }
.cell {
  width: 104px; height: 76px; padding: 0; border: 1px solid var(--rule); background: var(--panel); position: relative;
  transition: background-color .15s, opacity .2s;
}
.cell .split {
  position: absolute; inset: 0;
  background: linear-gradient(to top right, transparent calc(50% - .5px), var(--rule) 50%, transparent calc(50% + .5px));
}
.pay { position: absolute; font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; padding: 2px 3px; }
.pay-p0 { left: 10px; bottom: 10px; color: var(--row); }
.pay-p1 { right: 10px; top: 10px; color: var(--col-ink); }
.pay.best { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
input.pay { width: auto; min-width: 2.2ch; border: 1px dashed var(--rule); border-radius: 4px; background: transparent; font-family: var(--ui); text-align: center; }
input.pay:hover { border-color: var(--muted); }
.cell.clickable { cursor: pointer; }
.cell.clickable:hover { background: var(--row-soft); }
.cell.hi { background: var(--row-soft); }
.cell.nash { box-shadow: inset 0 0 0 3px var(--eq); background: var(--eq-soft); }
.cell.dead { opacity: .22; }
.strat { font: inherit; color: inherit; }
.strat-p0 { color: var(--row); }
.strat-p1 { color: var(--col-ink); }
button.strat { background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
button.strat:hover { border-color: currentColor; }
.strat.dead { text-decoration: line-through; opacity: .45; }
.matrix-wrap figcaption { font: 14px/1.45 var(--ui); color: var(--muted); margin-top: 10px; max-width: 60ch; }
.key { font: 14px var(--ui); color: var(--muted); margin: 0; }
.chip { font-weight: 700; }
.chip-p0 { color: var(--row); }
.chip-p1 { color: var(--col-ink); }

/* ---------- Interactives ---------- */
.interactive { margin: 24px 0 32px; padding: 20px 22px; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--row); border-radius: 4px 10px 10px 4px; }
.interactive .matrix-wrap { margin: 12px 0; }
.prompt { font: 600 17px var(--ui); }
.result { font-size: 19px; font-weight: 600; }
.choices, .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
.btn { font: 600 15px var(--ui); padding: 10px 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
.btn-p0 { background: var(--row); border-color: var(--row); color: #fff; }
.btn-p0:hover { filter: brightness(1.1); }
.btn-quiet { border-color: var(--rule); }
.btn-quiet:hover { border-color: var(--ink); }
.compare { font-size: 16px; padding-left: 20px; }
.feedback { font: 500 16px/1.5 var(--ui); padding-left: 12px; border-left: 3px solid var(--rule); }
.feedback.good, .feedback.done { border-color: var(--eq); }
.feedback.bad { border-color: var(--bad); }

/* ---------- Depth layers ---------- */
.depth { margin: 24px 0; padding: 16px 20px; border: 1px dashed var(--rule); border-radius: 10px; font-size: 17px; }
.depth-tag { display: inline-block; font: 700 13px var(--ui); color: var(--muted); margin-bottom: 6px; }
.depth-formal { border-color: var(--row); }
.depth-quant { border-color: var(--col); }
[data-depth="intuition"] .depth-formal, [data-depth="intuition"] .depth-quant, [data-depth="formal"] .depth-quant { display: none; }
.drill .matrix-wrap { margin: 8px 0; }

.tip { margin: 40px 0 0; padding: 14px 18px; border-radius: 8px; background: var(--col-soft); font: 16px/1.5 var(--ui); }
.pager { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule); }
.soon-note { font: 15px var(--ui); color: var(--muted); }

/* ---------- Small screens ---------- */
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .toc { position: fixed; top: 56px; left: 0; bottom: 0; width: 290px; max-height: none; background: var(--paper); border-right: 1px solid var(--rule); transform: translateX(-100%); transition: transform .2s; z-index: 4; }
  body.toc-open .toc { transform: none; }
  .toc-toggle { display: inline-block; font: 600 14px var(--ui); padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: transparent; color: var(--ink); }
  main { padding: 28px 16px 80px; }
  .depth-label { display: none; }
  .depth-switch button { padding: 6px 8px; font-size: 13px; }
  .topbar { gap: 10px; padding: 0 12px; }
  .brand { font-size: 18px; }
  h1 { font-size: 36px; }
  .cell { width: 84px; height: 66px; }
  .pay { font-size: 18px; }
  .matrix .corner { width: 90px; }
  .interactive { padding: 16px 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Deviation arrows and marked guesses ---------- */
.arrow { position: absolute; font: 700 17px/1 var(--ui); }
.arrow-p1 { left: 9px; top: 8px; color: var(--col-ink); }
.arrow-p0 { right: 9px; bottom: 8px; color: var(--row); }
.cell.marked { box-shadow: inset 0 0 0 3px var(--ink); }
.cell.marked.nash { box-shadow: inset 0 0 0 3px var(--eq); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.tabs button { font: 600 14px var(--ui); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.legend { font: 14px/1.5 var(--ui); color: var(--muted); }
.display { text-align: center; margin: 12px 0 16px; font-size: 19px; }
.steps { font: 16px/1.55 var(--ui); padding-left: 22px; }
.steps li { margin-bottom: 4px; }
.matrix td.cell { min-width: 104px; }
.matrix th.corner { min-width: 112px; }
@media (max-width: 860px) {
  .matrix td.cell { min-width: 76px; }
  .matrix th.corner { min-width: 96px; }
}

/* ================= Landing page (#/) =================
   Photographic, full-bleed and dark in both colour schemes: the photos set the mood,
   so the page doesn't flip to a light theme. Course pages keep their own theme. */

body.landing { background: #000; }
body.landing .topbar, body.landing .toc { display: none; }
body.landing .layout { display: block; max-width: none; }
body.landing main { padding: 0; }

.lp {
  --lp-bg: #000;
  --lp-ink: #ede8df;
  --lp-soft: #b9b2a6;
  --lp-line: rgba(237, 232, 223, .26);
  --lp-display: "Fraunces", "Source Serif 4", Georgia, serif;
  --lp-text: "Geist", "Archivo", system-ui, sans-serif;
  /* Game colours re-tuned for a black page */
  --paper: #000; --panel: #0f0f0f; --ink: #ede8df; --muted: #a39d93; --rule: #3a3833; --grid: #191919;
  --row: #8aa6ff; --row-soft: #8aa6ff24; --col: #f0b429; --col-ink: #f0b429; --col-soft: #f0b42924;
  --eq: #45c993; --eq-soft: #45c9931f;
  background: var(--lp-bg); color: var(--lp-ink);
  font: 300 18px/1.6 var(--lp-text); letter-spacing: -0.005em;
  color-scheme: dark;
}
.lp a { color: inherit; }
.lp :focus-visible { outline: 2px solid var(--lp-ink); outline-offset: 3px; border-radius: 2px; }
.lp h1, .lp h2, .lp h3 {
  font-family: var(--lp-display); font-weight: 200; font-stretch: normal; color: var(--lp-ink);
  font-variation-settings: "opsz" 144, "SOFT" 30; letter-spacing: -0.035em; line-height: 1.02; margin: 0;
}

/* ---------- Fixed nav ---------- */
.lp-nav {
  position: fixed; inset: 0 0 auto; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 18px clamp(16px, 3vw, 36px); pointer-events: none;
}
.lp-nav > * { pointer-events: auto; }
.lp-brand { justify-self: center; font: 300 22px/1 var(--lp-display); letter-spacing: -0.02em; text-decoration: none; color: var(--lp-ink); }
.lp-nav-btn {
  justify-self: start; font: 400 14px/1 var(--lp-text); color: var(--lp-ink); background: none; border: 0; padding: 10px 0; cursor: pointer;
  text-decoration: none; border-bottom: 1px solid var(--lp-line);
}
.lp-nav-btn:hover { border-bottom-color: var(--lp-ink); }
.lp-nav-start { justify-self: end; }
.lp-nav::before { /* soft shade so the nav stays legible over bright photos */
  content: ""; position: absolute; inset: 0 0 -40px; z-index: -1; pointer-events: none;
  background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
}

/* ---------- Overlay menu ---------- */
.lp-menu {
  position: fixed; inset: 0; z-index: 25; background: #000; overflow: auto;
  display: grid; place-items: center; padding: 96px 20px 40px;
}
.lp-menu[hidden] { display: none; }
body.lp-menu-open { overflow: hidden; }
.lp-menu-list { list-style: none; margin: 0; padding: 0; width: min(760px, 100%); }
.lp-menu-list li { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--lp-line); }
.lp-menu-list .n { font: 300 15px var(--lp-text); color: var(--lp-soft); font-variant-numeric: tabular-nums; }
.lp-menu-list a, .lp-menu-list li > span:nth-child(2) {
  font: 200 clamp(24px, 3.6vw, 38px)/1.15 var(--lp-display); letter-spacing: -0.03em; text-decoration: none;
}
.lp-menu-list a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.lp-menu-list .is-soon > span:nth-child(2) { color: var(--lp-soft); opacity: .6; }
.soon { font: 300 13px var(--lp-text); color: var(--lp-soft); white-space: nowrap; }

/* ---------- Full-bleed photo panels ---------- */
.lp-panel { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; isolation: isolate; background: #000; }
.lp-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.lp-panel::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.lp-hold { height: 100vh; height: 100svh; }

/* Buttons */
.lp-btn {
  display: inline-block; font: 400 14px/1 var(--lp-text); letter-spacing: .01em; color: var(--lp-ink); text-decoration: none;
  padding: 15px 22px; border: 1px solid var(--lp-line); background: rgba(0,0,0,.25); backdrop-filter: blur(6px);
  transition: background-color .25s, border-color .25s, color .25s;
}
.lp-btn:hover { border-color: var(--lp-ink); background: rgba(0,0,0,.5); }
.lp .lp-btn-solid { background: var(--lp-ink); color: #000; border-color: var(--lp-ink); }
.lp .lp-btn-solid:hover { background: #fff; color: #000; }

/* ---------- 1. Hero ---------- */
.lp-hero .lp-photo { object-position: 50% 70%; }
.lp-hero::after { background: radial-gradient(120% 70% at 50% 100%, transparent 40%, rgba(0,0,0,.35)); }
.lp-hero-text { position: absolute; inset: 12vh 20px 9vh; text-align: center; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.lp-hero h1 { font-size: clamp(46px, min(8.6vw, 14vh), 150px); }
.lp-hero p { margin-left: clamp(0px, 4vw, 76px) !important; }
.lp-hero h1 span { display: inline-block; }
.lp-hero p { margin: 0; align-self: flex-start; text-align: left; max-width: 30ch; color: var(--lp-soft); font-size: clamp(16px, 1.4vw, 19px); }
/* The page's one orchestrated moment: the headline focuses out of blur on load. */
.lp-hero h1 span, .lp-hero p { opacity: 0; filter: blur(14px); transform: translateY(8px); transition: opacity 1.1s ease, filter 1.3s ease, transform 1.3s cubic-bezier(.2,.7,.2,1); }
.lp-hero.is-in h1 span, .lp-hero.is-in p { opacity: 1; filter: blur(0); transform: none; }
.lp-hero.is-in h1 span:nth-child(2) { transition-delay: .25s; }
.lp-hero.is-in p { transition-delay: .7s; }
.lp-hero .lp-photo { transform: scale(1.06); transition: transform 2.4s cubic-bezier(.2,.7,.2,1); }
.lp-hero.is-in .lp-photo { transform: none; }

/* ---------- 2. Statement ---------- */
.lp-statement .lp-photo { object-position: 70% 50%; }
.lp-statement::after { background: linear-gradient(90deg, rgba(0,0,0,.94) 0%, rgba(0,0,0,.8) 46%, rgba(0,0,0,.1) 72%); }
.lp-statement-inner { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 clamp(20px, 6vw, 96px); }
.lp-statement-text {
  max-width: min(19em, 42vw) !important;
  font: 200 clamp(28px, 3.6vw, 54px)/1.14 var(--lp-display); letter-spacing: -0.03em; max-width: 19em; margin: 0;
  font-variation-settings: "opsz" 144, "SOFT" 30;
}
.lp-statement-text .w { color: rgba(237, 232, 223, .16); transition: color .35s ease; }
.lp-statement-text .w.on { color: var(--lp-ink); }

/* ---------- 3. Play first ---------- */
.lp-play {
  position: relative; z-index: 1; background: #000; display: grid; gap: clamp(32px, 5vw, 80px);
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: center;
  padding: clamp(96px, 14vh, 160px) clamp(20px, 6vw, 96px); border-top: 1px solid var(--lp-line);
}
.lp-play h2, .lp-depths-head h2 { font-size: clamp(38px, 5vw, 76px); margin-bottom: 22px; }
.lp-play-copy p { color: var(--lp-soft); max-width: 40ch; margin-bottom: 30px; }
.lp-play-game { font-family: var(--lp-text); }
.lp-play-game .key { font-size: 14px; color: var(--lp-soft); }
.lp-play-game .matrix-wrap { margin: 10px 0 14px; }
.lp-play-game .matrix { font-family: var(--lp-text); }
.lp-play-game .pay { font-weight: 500; }
.lp-play-game .cell { background: #0f0f0f; }
.lp-status { min-height: 3.2em; margin: 0; font-size: 16px; color: var(--lp-ink); border-left: 1px solid var(--lp-line); padding: 2px 0 2px 14px; }

/* ---------- 4. Three depths ---------- */
.lp-depths { position: relative; z-index: 1; background: #000; padding: clamp(96px, 14vh, 160px) clamp(20px, 6vw, 96px); border-top: 1px solid var(--lp-line); }
.lp-depths-head { max-width: 760px; margin-bottom: clamp(48px, 8vh, 96px); }
.lp-depths-head p { color: var(--lp-soft); max-width: 46ch; margin: 0; }
.lp-depth-list { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(64px, 10vh, 120px); }
.lp-depth { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(24px, 4vw, 64px); align-items: end; }
.lp-depth:nth-child(even) { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); }
.lp-depth:nth-child(even) .lp-depth-img { order: 2; }
.lp-depth-img { position: relative; aspect-ratio: 16 / 10; overflow: hidden; }
.lp-depth-img .lp-photo { z-index: 0; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.lp-depth:hover .lp-depth-img .lp-photo { transform: scale(1.03); }
.lp-count { font-size: 15px; color: var(--lp-soft); margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.lp-count span { color: var(--lp-ink); }
.lp-depth h3 { font-size: clamp(44px, 5.4vw, 84px); margin-bottom: 18px; }
.lp-depth-text p:not(.lp-count) { color: var(--lp-soft); margin-bottom: 28px; max-width: 38ch; }

/* ---------- 5. Course parts ---------- */
.lp-course { position: relative; z-index: 1; background: #000; }
.lp-course-h { font-size: clamp(38px, 5vw, 76px); padding: clamp(96px, 14vh, 160px) clamp(20px, 6vw, 96px) clamp(40px, 6vh, 72px); border-top: 1px solid var(--lp-line); }
.lp-part::after { background: linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 38%, rgba(0,0,0,.1) 70%); }
.lp-part:nth-of-type(3) .lp-photo { object-position: 50% 35%; } /* cards: keep the hands in frame */
.lp-part-text { position: absolute; inset: auto 0 0; padding: 0 clamp(20px, 6vw, 96px) clamp(32px, 7vh, 72px);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: clamp(24px, 5vw, 80px); align-items: end; }
.lp-part-num { grid-column: 1; font-size: 15px; color: var(--lp-soft); margin: 0 0 4px; }
.lp-part h3 { grid-column: 1; font-size: clamp(48px, 7vw, 116px); }
.lp-part-line { grid-column: 2; grid-row: 1 / span 2; align-self: end; color: var(--lp-ink); max-width: 40ch; margin: 0; }
.lp-part-list { grid-column: 1 / -1; list-style: none; margin: clamp(24px, 4vh, 40px) 0 0; padding: 0; display: flex; flex-wrap: wrap; border-top: 1px solid var(--lp-line); }
.lp-part-list li { flex: 1 1 220px; padding: 14px 20px 0 0; display: flex; flex-direction: column; gap: 2px; counter-increment: none; }
.lp-part-list li::before { content: "Chapter " attr(data-n); font-size: 13px; color: var(--lp-soft); }
.lp-part-list a { font-size: 17px; text-decoration: none; border-bottom: 1px solid var(--lp-line); align-self: start; padding-bottom: 2px; }
.lp-part-list a:hover { border-bottom-color: var(--lp-ink); }
.lp-part-list .is-soon > span:not(.soon) { color: var(--lp-soft); font-size: 17px; }

/* ---------- 6. Close + footer ---------- */
.lp-close { position: relative; z-index: 1; }
.lp-close::after { background: radial-gradient(90% 70% at 50% 45%, rgba(0,0,0,.65), rgba(0,0,0,.2)); }
.lp-close-text { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 36px; text-align: center; padding: 20px; }
.lp-close h2 { font-size: clamp(52px, 10vw, 168px); }
.lp-footer { position: relative; z-index: 1; background: #000; padding: 40px clamp(20px, 6vw, 96px) 56px; border-top: 1px solid var(--lp-line); font-size: 14px; }
.lp-footer nav { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-bottom: 22px; }
.lp-footer nav a, .lp-footer nav button { font: inherit; color: var(--lp-ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; border-bottom: 1px solid var(--lp-line); }
.lp-footer nav a:hover, .lp-footer nav button:hover { border-bottom-color: var(--lp-ink); }
.lp-credits { color: var(--lp-soft); max-width: 90ch; margin: 0; font-size: 13px; }
.lp-credits a { color: var(--lp-soft); }

/* Scroll progress line */
.lp-progress { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; z-index: 30; background: rgba(237,232,223,.12); }
.lp-progress span { display: block; height: 100%; background: var(--lp-ink); transform-origin: 0 50%; transform: scaleX(0); }

/* ---------- Small screens ---------- */
@media (max-width: 860px) {
  .lp { font-size: 17px; }
  .lp-hero-text { inset: 13vh 16px auto; justify-content: flex-start; }
  .lp-hero p { align-self: center; text-align: center; margin-top: 18px; margin-left: 0 !important; }
  .lp-statement .lp-photo { object-position: 78% 50%; }
  .lp-statement::after { background: linear-gradient(0deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.1) 75%); }
  .lp-statement-inner { align-items: flex-end; padding-bottom: 12vh; }
  .lp-statement-text { max-width: none !important; }
  .lp-part::after { background: linear-gradient(0deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.82) 55%, rgba(0,0,0,.2) 85%); }
  .lp-play, .lp-depth, .lp-depth:nth-child(even) { grid-template-columns: minmax(0, 1fr); }
  .lp-depth:nth-child(even) .lp-depth-img { order: 0; }
  .lp-part-text { grid-template-columns: minmax(0, 1fr); }
  .lp-part-line { grid-column: 1; grid-row: auto; margin-top: 14px; }
  .lp-part-list li { flex-basis: 100%; padding-top: 10px; }
  .lp-play-game .matrix-wrap { overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .lp-hero h1 span, .lp-hero p, .lp-hero .lp-photo { opacity: 1; filter: none; transform: none; }
  .lp-statement-text .w { color: var(--lp-ink); }
}
